<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#0052CC"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#002D80" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Apple HIG Squircle Background -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  
  <!-- Subtle Glass Inner Glow -->
  <rect x="8" y="8" width="496" height="496" rx="107" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.25"/>

  <!-- Stylized Dumbbell / Strength Icon -->
  <g filter="url(#shadow)" transform="translate(106, 106)">
    <!-- Dumbbell Bar -->
    <rect x="50" y="135" width="200" height="30" rx="15" fill="url(#metal)"/>
    
    <!-- Left Weight Plates -->
    <rect x="15" y="85" width="35" height="130" rx="12" fill="url(#metal)"/>
    <rect x="55" y="105" width="20" height="90" rx="8" fill="#CBD5E1"/>
    
    <!-- Right Weight Plates -->
    <rect x="250" y="85" width="35" height="130" rx="12" fill="url(#metal)"/>
    <rect x="225" y="105" width="20" height="90" rx="8" fill="#CBD5E1"/>

    <!-- Dynamic Lightning / Power Accent -->
    <path d="M 150 70 L 125 150 L 155 150 L 135 230 L 195 130 L 160 130 Z" fill="#FACC15" stroke="#FFFFFF" stroke-width="3"/>
  </g>
</svg>
